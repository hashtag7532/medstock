name: medstock
description: Scan medicines into a home inventory and get warned before buying duplicates.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_timezone: ^5.1.1
  google_mlkit_text_recognition: ^0.15.0
  http: ^1.2.2
  image_picker: ^1.1.2
  path: ^1.9.0
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
